# Base configuration for the custom NGINX build.
#
# The build script replaces the /tmp paths below with the configured native
# paths after installation. Keep these exact lines when changing this file:
# install_nginx relies on them for that conversion.

pid /tmp/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;
worker_shutdown_timeout 10s;
pcre_jit on;
error_log stderr warn;

events {
    use epoll;
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uaddr=$upstream_addr '
                    'ustatus=$upstream_status urt=$upstream_response_time';

    # These paths are converted by install_nginx for native installations.
    access_log /dev/stdout main;
    error_log stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;

    sendfile on;
    aio threads;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    client_max_body_size 16m;
    large_client_header_buffers 4 8k;
    ignore_invalid_headers on;
    underscores_in_headers off;

    types_hash_max_size 4096;
    server_tokens off;
    server_name_in_redirect off;
    port_in_redirect off;

    # Avoid repeated filesystem metadata lookups for static assets.
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Shared helpers for reverse-proxy and rate-limit virtual hosts.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=per_ip_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
    limit_conn_zone $binary_remote_addr zone=default_conn:5m;
    limit_req_zone $binary_remote_addr zone=default_req:10m rate=2r/m;
    limit_req_status 429;
    limit_conn_status 429;

    # TLS defaults. HSTS and certificates belong in HTTPS virtual hosts.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_early_data off;
    ssl_buffer_size 4k;
    quic_retry on;

    # Compression is enabled for text and structured responses. Levels are
    # intentionally moderate to keep CPU cost bounded under concurrency.
    gzip on;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_static on;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.apple.mpegurl
        application/vnd.geo+json
        application/xhtml+xml
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1024;
    brotli_static on;
    brotli_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.apple.mpegurl
        application/vnd.geo+json
        application/xhtml+xml
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # zstd is compiled into this build and negotiated only by clients that
    # advertise support for it. Keep the level low for predictable latency.
    zstd on;
    zstd_comp_level 3;
    zstd_min_length 1024;
    zstd_static on;
    zstd_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.apple.mpegurl
        application/vnd.geo+json
        application/xhtml+xml
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Remove identifying headers from NGINX and common upstreams.
    more_clear_headers Server;
    more_clear_headers X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # Safe defaults that do not require application-specific CSP or HSTS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-XSS-Protection "0" always;

    # Common reverse-proxy defaults. Configure trusted proxy networks and
    # override X-Forwarded-For in a vhost when another proxy is authoritative.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_request_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;
    proxy_temp_file_write_size 64k;

    # Reject unmatched clear-text hosts until an explicit virtual host is
    # configured. Named virtual hosts in conf.d still take precedence.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        error_log stderr crit;
        access_log off;

        # Unknown-host traffic is intentionally hostile to slow clients.
        client_header_timeout 1s;
        client_body_timeout 1s;
        send_timeout 1s;
        reset_timedout_connection on;
        lingering_close off;
        keepalive_timeout 0;
        client_header_buffer_size 512;
        large_client_header_buffers 2 512;

        location / {
            limit_conn default_conn 1;
            limit_conn_status 444;
            limit_req zone=default_req burst=2 nodelay;
            limit_req_status 444;

            # The path is deliberately absent. try_files runs after the
            # limiting phases, then closes the connection without a response.
            root /var/empty;
            try_files /__nginx_unconfigured_host__ =444;
        }
    }

    # Reject unknown TLS SNI values before certificate selection. No
    # certificate is needed because ssl_reject_handshake aborts the handshake.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        listen 443 quic reuseport default_server;
        server_name _;
        error_log stderr crit;
        ssl_reject_handshake on;
    }

    # Keep this exact path and indentation: install_nginx rewrites it when
    # CONF_PATH points to a non-default configuration directory.
    include /etc/nginx/conf.d/*.conf;
}

# TCP/UDP stream virtual hosts can be placed in stream.d. The custom build
# includes the stream module; the glob may remain empty on HTTP-only hosts.
stream {
    log_format stream '$remote_addr [$time_local] $protocol $status '
                      '$bytes_sent $bytes_received $session_time '
                      '"$upstream_addr"';
    # Enable a native file here in a stream vhost when connection logging is
    # required; /dev/stdout is intentionally not used for native validation.
    access_log off;
    error_log stderr warn;
    include /etc/nginx/stream.d/*.conf;
}
